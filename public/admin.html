<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#173f35"><title>Editar cardápio</title><link rel="stylesheet" href="/styles.css"></head><body><section class="login-wrap" id="loginView"><form class="login-card" id="loginForm"><span class="eyebrow">Acesso restrito</span><h1>Área de edição</h1><p>Informe a senha administrativa para atualizar o cardápio.</p><div class="field"><label for="password">Senha</label><input id="password" type="password" autocomplete="current-password" required></div><p class="error" id="loginError"></p><button class="btn" type="submit">Entrar</button> <a class="btn secondary" href="/">Voltar</a></form></section><main class="shell admin-body" id="editorView" hidden><header class="admin-header"><div><span class="eyebrow">Painel administrativo</span><h1>Editar cardápio</h1></div><div class="actions"><a class="btn secondary" href="/" target="_blank">Ver página pública</a><button class="btn danger" id="logout">Sair</button></div></header><form class="editor" id="menuForm"><div class="meta-grid"><div class="field"><label>Nome do serviço</label><input name="establishment" maxlength="90"></div><div class="field"><label>Texto da semana</label><input name="weekLabel" maxlength="90"></div></div><div id="dayEditors"></div><div class="actions"><button class="btn" id="save" type="submit">Salvar alterações</button></div></form></main><div class="status" id="status"></div><script src="/admin.js"></script></body></html>
